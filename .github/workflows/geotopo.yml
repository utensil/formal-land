name: Geotopo CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/geotopo.yml'
      - 'geotopo/**'
  workflow_dispatch:

jobs:
  pages:
    name: Stage Geotopo pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore github-pages cache
        uses: actions/cache/restore@v4
        with:
            path: github-pages
            key: github-pages-${{ github.run_id }}
            restore-keys: |
              github-pages
      - name: Stage pages
        run: |
          # Stage exactly the current tree: delete-then-copy so files removed
          # from geotopo/ drop out of the cached github-pages directory instead
          # of persisting. The generator, its tests and the JSON inputs are
          # private, so there is nothing to build here: this directory holds the
          # published page and nothing else.
          rm -rf github-pages/geotopo
          mkdir -p github-pages/geotopo
          cp -R geotopo/. github-pages/geotopo/
      - name: Save github-pages cache
        uses: actions/cache/save@v4
        with:
            path: github-pages
            key: github-pages-${{ github.run_id }}
      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-geotopo
          path: github-pages/geotopo
          if-no-files-found: error
