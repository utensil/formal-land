name: Geotopo CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/geotopo.yml'
      - 'geotopo/**'
  pull_request:
    paths:
      - '.github/workflows/geotopo.yml'
      - 'geotopo/**'
  workflow_dispatch:

jobs:
  pages:
    name: Stage Geotopo pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone page
        run: |
          test -s geotopo/geotopo-route-map.html
          test -s geotopo/README.md
      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-geotopo
          path: geotopo
          if-no-files-found: error
