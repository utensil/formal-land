name: Geotopo CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/geotopo.yml'
      - 'geotopo/**'
  pull_request:
    paths:
      - '.github/workflows/geotopo.yml'
      - 'geotopo/**'
  workflow_dispatch:

jobs:
  pages:
    name: Stage Geotopo pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the standalone page
        run: |
          # The JSON inputs are private (a published page is one self-contained
          # HTML carrying its own data), so this checkout usually has none and
          # the build check is skipped here; run it locally, where the private
          # data lives. The unit tests guard themselves the same way.
          if [ -f geotopo/data/prs.json ]; then
            python3 geotopo/build.py --check
          else
            echo "No private data in this checkout; skipping build.py --check (run it locally)."
          fi
          python3 -m unittest discover -s geotopo/tests -v
          node --check geotopo/src/app.js
          node --test geotopo/tests/time.test.cjs
      - name: Stage standalone output
        run: |
          mkdir staging-geotopo
          cp geotopo/geotopo-route-map.html geotopo/README.md staging-geotopo/
      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-geotopo
          path: staging-geotopo
          if-no-files-found: error
