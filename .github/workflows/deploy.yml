# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# based on https://github.com/actions/starter-workflows/blob/main/pages/static.yml
# and https://stackoverflow.com/questions/62750603/github-actions-trigger-another-action-after-one-action-is-completed/65698892#65698892
name: Deploy Gitub Pages

on:
  workflow_run:
    workflows: ["Aya CI", "Lean 4 CI", "TLA+ CI", "SpinRep CI"]
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # only deploy if the workflow_run was successful or if this is triggered by workflow_dispatch
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
        - name: Checkout
          uses: actions/checkout@v4
        - uses: extractions/setup-just@v2
          with:
            just-version: 1.35.0
        - name: Test artifact query
          run: |
            just jobs
        - name: Setup Pages
          uses: actions/configure-pages@v5
        - name: Download pages from the three CIs
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            set -euo pipefail
            mkdir -p github-pages
            # Each project CI uploads its own pages as a stable-named artifact; merge
            # the latest successful build of each here. Artifacts are not branch-scoped
            # and outlive the cache retention window. Layout: pages-lean4 contains the
            # three lean4 directories; pages-aya/pages-tla/pages-spinrep contain their
            # project's files (single-path uploads flatten), so those are wrapped in
            # their project dir.
            for spec in "aya.yml pages-aya" "lean4.yml pages-lean4" "tla.yml pages-tla" "spinrep.yml pages-spinrep"; do
              set -- $spec
              wf_file=$1
              artifact=$2
              run_id=$(gh run list --workflow "$wf_file" --status success --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$run_id" ]; then
                echo "Downloading $artifact from $wf_file run $run_id"
                if ! gh run download "$run_id" -n "$artifact" -D "staging-$artifact"; then
                  echo "::warning::No $artifact uploaded in run $run_id; keeping the current $artifact deployment"
                  continue
                fi
                case "$artifact" in
                  pages-aya)     mkdir -p github-pages/aya;     cp -R "staging-$artifact/." github-pages/aya/ ;;
                  pages-tla)     mkdir -p github-pages/tla;     cp -R "staging-$artifact/." github-pages/tla/ ;;
                  pages-spinrep) mkdir -p github-pages/spinrep; cp -R "staging-$artifact/." github-pages/spinrep/ ;;
                  pages-lean4) cp -R "staging-$artifact/." github-pages/ ;;
                esac
              else
                echo "::warning::No successful run of $wf_file yet; skipping $artifact"
              fi
            done
        - name: Display structure of downloaded files
          run: ls -R github-pages
        - name: Check pages completeness
          run: |
            set -euo pipefail
            # Never deploy a partial site. Every section must end up in the tree
            # either from a fresh artifact or from the restored github-pages cache;
            # a missing section means the cache was absent or expired for it.
            # Force a complete redeploy: re-run that project's CI with an
            # [annotate] tag in the commit message so cache and artifact are
            # rebuilt, then retry this deploy.
            missing=0
            for d in aya tla spinrep lean4 lean4-duper-xp lean4-verso-xp; do
              if [ ! -d "github-pages/$d" ]; then
                echo "::error::github-pages/$d is missing: no fresh artifact and no cached content. Re-run the project CIs with an [annotate] commit to rebuild the pages cache, then retry the deploy."
                missing=1
              fi
            done
            [ "$missing" -eq 0 ]
        - name: Copy assets
          run: |
            just copy-assets
        # - name: Check pages
        #   run: |
        #     just check-pages
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: github-pages
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4

