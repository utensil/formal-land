# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# based on https://github.com/actions/starter-workflows/blob/main/pages/static.yml
# and https://stackoverflow.com/questions/62750603/github-actions-trigger-another-action-after-one-action-is-completed/65698892#65698892
name: Deploy Gitub Pages

on:
  workflow_run:
    workflows: ["Aya CI", "Lean 4 CI", "TLA+ CI"]
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # only deploy if the workflow_run was successful or if this is triggered by workflow_dispatch
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
        - name: Checkout
          uses: actions/checkout@v4
        - uses: extractions/setup-just@v2
          with:
            just-version: 1.35.0
        - name: Test artifact query
          run: |
            just jobs
        - name: Setup Pages
          uses: actions/configure-pages@v5
        - name: Download pages from the three CIs
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            set -euo pipefail
            mkdir -p github-pages
            # Each project CI uploads its own github-pages subdir as a stable-named
            # artifact; merge the latest successful build of each here. Artifacts are
            # not branch-scoped and outlive the cache retention window.
            for spec in "aya.yml pages-aya" "lean4.yml pages-lean4" "tla.yml pages-tla"; do
              set -- $spec
              wf_file=$1
              artifact=$2
              run_id=$(gh run list --workflow "$wf_file" --status success --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$run_id" ]; then
                echo "Downloading $artifact from $wf_file run $run_id"
                gh run download "$run_id" -n "$artifact" -D github-pages
              else
                echo "::warning::No successful run of $wf_file yet; skipping $artifact"
              fi
            done
        - name: Display structure of downloaded files
          run: ls -R github-pages
        - name: Copy assets
          run: |
            just copy-assets
        # - name: Check pages
        #   run: |
        #     just check-pages
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: github-pages
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4

