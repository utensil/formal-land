name: SpinRep CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/spinrep.yml'
      - 'spinrep/**'
  workflow_dispatch:

jobs:
  pages:
    name: Stage SpinRep pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache github-pages
        uses: actions/cache@v4
        with:
            path: github-pages
            key: github-pages-${{ github.run_id }}
            restore-keys: |
              github-pages
      - name: Stage pages
        run: |
          mkdir -p github-pages/spinrep
          cp -R spinrep/. github-pages/spinrep/
      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-spinrep
          path: github-pages/spinrep
          if-no-files-found: error
