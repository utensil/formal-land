name: SpinRep CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/spinrep.yml'
      - 'spinrep/**'
  workflow_dispatch:

jobs:
  pages:
    name: Stage SpinRep pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore github-pages cache
        uses: actions/cache/restore@v4
        with:
            path: github-pages
            key: github-pages-${{ github.run_id }}
            restore-keys: |
              github-pages
      - name: Stage pages
        run: |
          # Stage exactly the current tree: delete-then-copy so files removed
          # from spinrep/ (e.g. the retired reuse proposal) drop out of the
          # cached github-pages directory instead of persisting.
          rm -rf github-pages/spinrep
          mkdir -p github-pages/spinrep
          cp -R spinrep/. github-pages/spinrep/
      - name: Save github-pages cache
        uses: actions/cache/save@v4
        with:
            path: github-pages
            key: github-pages-${{ github.run_id }}
      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-spinrep
          path: github-pages/spinrep
          if-no-files-found: error
